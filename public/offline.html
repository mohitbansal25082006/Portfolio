<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#282923" />
  <meta name="robots" content="noindex" />
  <title>Offline — Mohit Bansal</title>
  <style>
    :root { color-scheme: dark; --bg: #1d1e19; --fg: #e8e7dc; --muted: #9a9a8c; --accent: #ecf221; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    main { max-width: 420px; }
    img { width: 88px; height: 88px; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { margin: 0 0 28px; color: var(--muted); }
    button {
      appearance: none; border: 0; cursor: pointer; border-radius: 999px;
      background: var(--accent); color: #111; font: inherit; font-weight: 600;
      padding: 12px 28px; min-height: 44px;
    }
    button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img id="logo" src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p id="msg">This page isn't available without a connection. Pages you've already visited still work — reconnect to see the latest.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    if (location.pathname.indexOf('/admin') === 0) {
      document.getElementById('logo').src = '/icons/admin-icon-192.png'
      document.getElementById('msg').textContent =
        'The admin dashboard needs a live connection. Reconnect and try again.'
      document.title = 'Offline — Admin'
    }
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
